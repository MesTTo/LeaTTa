# Build the LeaTTa interpreter binary on Linux, macOS, and Windows, and attach the
# bundles to the GitHub release for the pushed tag. Trigger by pushing a tag like
# `v1.0.0`, or run manually from the Actions tab. The interpreter binary does not link
# Mathlib, so these jobs build only the small kernel and finish quickly.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      # lean-action installs elan and the pinned toolchain, then runs the build in a
      # shell where lake is on PATH. We let it run the build itself (build-args targets
      # only the interpreter exe), because a separate `run: lake build` step defaults to
      # PowerShell on Windows, where lake is not found.
      - name: Build LeaTTa (sets up elan + lake)
        uses: leanprover/lean-action@v1
        with:
          build-args: "LeaTTa"
          test: false
          lint: false

      - name: Package bundle (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -oE 'version := v!"[^"]+"' lakefile.lean | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          NAME="leatta-${VERSION}-${{ matrix.platform }}"
          mkdir -p "dist/$NAME/bin" "dist/$NAME/examples"
          cp .lake/build/bin/LeaTTa "dist/$NAME/bin/"
          strip "dist/$NAME/bin/LeaTTa" || true
          cp scripts/install.sh "dist/$NAME/"; chmod +x "dist/$NAME/install.sh"
          cp LICENSE "dist/$NAME/" || true
          for f in a1_symbols b1_equal_chain c1_grounded_basic d1_gadt test_stdlib; do
            cp "tests/corpus/$f.metta" "dist/$NAME/examples/" 2>/dev/null || true
          done
          cp tests/mettail/bool.mettail "dist/$NAME/examples/" 2>/dev/null || true
          scripts/write-release-readme.sh "dist/$NAME" "$VERSION" "${{ matrix.platform }}"
          ( cd dist && tar czf "$NAME.tar.gz" "$NAME" )
          ( cd dist && (sha256sum "$NAME.tar.gz" || shasum -a 256 "$NAME.tar.gz") > "$NAME.tar.gz.sha256" )

      - name: Package bundle (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -oE 'version := v!"[^"]+"' lakefile.lean | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          NAME="leatta-${VERSION}-windows-x86_64"
          mkdir -p "dist/$NAME/bin" "dist/$NAME/examples"
          cp .lake/build/bin/LeaTTa.exe "dist/$NAME/bin/"
          cp LICENSE "dist/$NAME/" || true
          for f in a1_symbols b1_equal_chain c1_grounded_basic d1_gadt test_stdlib; do
            cp "tests/corpus/$f.metta" "dist/$NAME/examples/" 2>/dev/null || true
          done
          cp tests/mettail/bool.mettail "dist/$NAME/examples/" 2>/dev/null || true
          scripts/write-release-readme.sh "dist/$NAME" "$VERSION" "windows-x86_64"
          ( cd dist && 7z a "$NAME.zip" "$NAME" >/dev/null )
          ( cd dist && certutil -hashfile "$NAME.zip" SHA256 > "$NAME.zip.sha256" )

      - name: Upload bundle as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: leatta-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256

      - name: Attach bundle to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
